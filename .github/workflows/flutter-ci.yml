name: Flutter CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2.18.0
        with:
          channel: stable
          cache: true
      - name: Run pub get
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Test
        run: flutter test

  build-ios:
    runs-on: macos-latest
    needs: analyze
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2.18.0
        with:
          channel: stable
      - name: Run pub get
        run: flutter pub get
      - name: Build iOS
        id: build-ios
        run: flutter build ios --release --no-codesign
      - name: Archive iOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-ios
          path: build/ios

  build-android:
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2.18.0
        with:
          channel: stable
          cache: true
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/
            ~/.gradle/wrapper/
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Decode Keystore
        env:
          ENCODED_KEYSTORE: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          DECODED_KEYSTORE_PATH: "android/app/${{ secrets.STORE_FILE }}"
        run: echo "$ENCODED_KEYSTORE" | base64 -d > "$DECODED_KEYSTORE_PATH"
      - name: Populate android/key.properties
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          STORE_FILE: ${{ secrets.STORE_FILE }}
        run: |
          echo "keyAlias=$KEY_ALIAS" >> android/key.properties
          echo "keyPassword=$KEY_PASSWORD" >> android/key.properties
          echo "storePassword=$STORE_PASSWORD" >> android/key.properties
          echo "storeFile=$STORE_FILE" >> android/key.properties
      - name: Run pub get
        run: flutter pub get
      - name: Build APK
        id: build-apk
        run: flutter build apk --split-per-abi
      - name: Archive APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/
      - name: Build App Bundle
        id: build-app-bundle
        run: flutter build appbundle
      - name: Archive App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: build/app/outputs/bundle/release/app-release.aab
